<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IELTS Tutor">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme:dark)">
<link rel="manifest" href="manifest.json">
<title>IELTS Personal Tutor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --blue:#007AFF;--green:#34C759;--orange:#FF9F0A;--red:#FF3B30;
  --purple:#AF52DE;--teal:#5AC8FA;--indigo:#5856D6;
  --gray:#8E8E93;--gray2:#AEAEB2;--gray3:#C7C7CC;--gray4:#D1D1D6;--gray5:#E5E5EA;--gray6:#F2F2F7;
  --card:#FFFFFF;--text:#000000;--text2:rgba(60,60,67,.6);--sep:rgba(60,60,67,.12);
}
html,body{height:100%;font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:var(--gray6);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column;max-width:430px;margin:0 auto;position:relative}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(83px + env(safe-area-inset-bottom));display:none}
.screen.active{display:block}
#tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:calc(49px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(249,249,249,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--sep);display:flex;align-items:flex-start;justify-content:space-around;z-index:100}
.tab-item{flex:1;height:49px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;user-select:none}
.tab-icon{font-size:20px;line-height:1}
.tab-label{font-size:9px;font-weight:500;color:var(--gray)}
.tab-item.active .tab-label{color:var(--blue)}
.screen-header{padding:calc(env(safe-area-inset-top)+16px) 20px 12px;background:var(--gray6)}
.screen-title{font-size:34px;font-weight:700;letter-spacing:.37px}
.screen-subtitle{font-size:15px;color:var(--text2);margin-top:2px}
.section{margin:0 16px 16px}
.sec-title{font-size:13px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:.4px;padding:0 4px 8px}
.card{background:var(--card);border-radius:16px;overflow:hidden}
.card-row{display:flex;align-items:center;padding:13px 16px;border-bottom:.5px solid var(--sep);gap:12px}
.card-row:last-child{border-bottom:none}
/* Hero banner */
.hero{margin:0 16px 16px;border-radius:20px;padding:20px;color:#fff;position:relative;overflow:hidden}
.hero-bg-study{background:linear-gradient(135deg,#007AFF,#5856D6)}
.hero-bg-speak{background:linear-gradient(135deg,#FF2D55,#FF9F0A)}
.hero-bg-read{background:linear-gradient(135deg,#34C759,#007AFF)}
.hero-bg-write{background:linear-gradient(135deg,#AF52DE,#FF2D55)}
.hero-bg-listen{background:linear-gradient(135deg,#5AC8FA,#34C759)}
.hero-badge{font-size:11px;font-weight:600;opacity:.8;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.hero-title{font-size:22px;font-weight:700;margin-bottom:4px}
.hero-sub{font-size:14px;opacity:.85}
.hero-day{position:absolute;right:20px;top:50%;transform:translateY(-50%);text-align:center}
.hero-day-num{font-size:42px;font-weight:700;line-height:1}
.hero-day-lbl{font-size:11px;opacity:.7;margin-top:2px}
/* Streak bar */
.streak-row{margin:0 16px 12px;display:flex;gap:10px}
.streak-chip{flex:1;background:var(--card);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.streak-chip-ico{font-size:26px}
.streak-chip-val{font-size:20px;font-weight:700}
.streak-chip-lbl{font-size:11px;color:var(--text2)}
/* Task cards */
.task-card{background:var(--card);border-radius:16px;padding:14px 16px;margin:0 16px 10px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .15s}
.task-card:active{transform:scale(.98)}
.task-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.task-body{flex:1;min-width:0}
.task-name{font-size:16px;font-weight:600;margin-bottom:3px}
.task-desc{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-check{width:28px;height:28px;border-radius:50%;border:2px solid var(--gray4);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:all .2s}
.task-check.done{background:var(--green);border-color:var(--green);color:#fff}
/* Vocab cards */
.vocab-scroll{display:flex;gap:10px;padding:0 16px 4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.vocab-scroll::-webkit-scrollbar{display:none}
.vcard{min-width:160px;background:var(--card);border-radius:16px;padding:14px;flex-shrink:0;cursor:pointer;transition:transform .15s}
.vcard:active{transform:scale(.96)}
.vcard-word{font-size:17px;font-weight:700;margin-bottom:2px}
.vcard-pos{font-size:11px;color:var(--blue);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.vcard-def{font-size:12px;color:var(--text2);line-height:1.4}
.vcard.learned{border:2px solid var(--green)}
/* Skill tabs */
.skill-tabs{display:flex;gap:8px;padding:0 16px 16px;overflow-x:auto;scrollbar-width:none}
.skill-tabs::-webkit-scrollbar{display:none}
.stab{padding:7px 16px;border-radius:20px;font-size:14px;font-weight:600;border:none;cursor:pointer;white-space:nowrap;transition:all .15s;font-family:inherit}
.stab.active{background:var(--blue);color:#fff}
.stab:not(.active){background:var(--card);color:var(--text2)}
/* Progress rings */
.rings-row{display:flex;justify-content:space-around;background:var(--card);border-radius:16px;margin:0 16px 16px;padding:16px}
.ring-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.ring-wrap{position:relative;width:72px;height:72px}
.ring-wrap svg{display:block;transform:rotate(-90deg)}
.ring-track{fill:none;stroke:var(--gray5);stroke-width:7}
.ring-fill{fill:none;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.34,1.56,.64,1)}
.ring-pct{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:14px;font-weight:700}
.ring-label{font-size:11px;color:var(--text2);font-weight:500}
/* Flash card */
.flashcard{margin:16px;perspective:1000px;cursor:pointer}
.flashcard-inner{position:relative;width:100%;height:220px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
.flashcard-front,.flashcard-back{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.flashcard-front{background:linear-gradient(135deg,var(--blue),var(--indigo))}
.flashcard-back{background:var(--card);transform:rotateY(180deg)}
.fc-word{font-size:32px;font-weight:700;color:#fff;margin-bottom:8px}
.fc-pos{font-size:13px;color:rgba(255,255,255,.7);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.fc-hint{font-size:13px;color:rgba(255,255,255,.6);margin-top:12px}
.fc-def{font-size:16px;font-weight:600;color:var(--text);margin-bottom:8px;line-height:1.4}
.fc-example{font-size:13px;color:var(--text2);font-style:italic;line-height:1.5}
.fc-syns{font-size:12px;color:var(--blue);margin-top:8px;font-weight:600}
/* Flashcard nav */
.fc-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin:0 16px 16px}
.fc-btn{width:52px;height:52px;border-radius:50%;border:none;font-size:22px;cursor:pointer;transition:transform .15s;font-family:inherit}
.fc-btn:active{transform:scale(.9)}
.fc-btn.wrong{background:#FF3B3020;color:var(--red)}
.fc-btn.right{background:#34C75920;color:var(--green)}
.fc-counter{font-size:15px;color:var(--text2);font-weight:600}
/* Reading passage */
.passage-box{background:var(--card);border-radius:16px;margin:0 16px 16px;padding:16px}
.passage-title{font-size:17px;font-weight:700;margin-bottom:12px}
.passage-text{font-size:15px;line-height:1.7;color:var(--text)}
.passage-text p{margin-bottom:12px}
.passage-text p:last-child{margin-bottom:0}
/* Questions */
.q-box{background:var(--card);border-radius:16px;margin:0 16px 10px;padding:16px}
.q-num{font-size:12px;font-weight:700;color:var(--blue);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.q-text{font-size:15px;font-weight:600;margin-bottom:10px;line-height:1.4}
.q-opts{display:flex;flex-direction:column;gap:8px}
.q-opt{padding:10px 14px;border-radius:10px;border:1.5px solid var(--gray5);font-size:14px;cursor:pointer;transition:all .15s;background:transparent;text-align:left;font-family:inherit;color:var(--text)}
.q-opt:active{transform:scale(.98)}
.q-opt.selected{border-color:var(--blue);background:#007AFF12}
.q-opt.correct{border-color:var(--green);background:#34C75912;color:var(--green)}
.q-opt.wrong{border-color:var(--red);background:#FF3B3012;color:var(--red)}
/* Writing */
.prompt-box{background:linear-gradient(135deg,#AF52DE,#FF2D55);border-radius:16px;margin:0 16px 16px;padding:20px;color:#fff}
.prompt-type{font-size:11px;font-weight:700;opacity:.75;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.prompt-text{font-size:15px;font-weight:600;line-height:1.5}
.writing-area{margin:0 16px 16px;background:var(--card);border-radius:16px;overflow:hidden}
.writing-toolbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:.5px solid var(--sep)}
.wc-label{font-size:13px;color:var(--text2)}
.wc-count{font-size:13px;font-weight:600;color:var(--blue)}
.writing-input{width:100%;min-height:200px;border:none;outline:none;font-size:15px;font-family:inherit;padding:14px 16px;resize:none;background:transparent;color:var(--text);line-height:1.7}
.writing-tips{background:var(--card);border-radius:16px;margin:0 16px 16px;padding:16px}
.tips-title{font-size:15px;font-weight:700;margin-bottom:10px}
.tip-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.tip-row:last-child{margin-bottom:0}
.tip-ico{font-size:16px;flex-shrink:0;margin-top:1px}
.tip-text{font-size:13px;color:var(--text2);line-height:1.5}
/* Speaking */
.cue-card{background:linear-gradient(135deg,#FF9F0A,#FF2D55);border-radius:16px;margin:0 16px 16px;padding:20px;color:#fff}
.cue-title{font-size:18px;font-weight:700;margin-bottom:12px}
.cue-items{margin-bottom:12px}
.cue-item{font-size:14px;margin-bottom:6px;opacity:.9}
.cue-note{font-size:12px;opacity:.7;font-style:italic}
.speak-btn{width:80px;height:80px;border-radius:50%;border:none;font-size:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;transition:transform .15s}
.speak-btn:active{transform:scale(.9)}
.speak-btn.idle{background:var(--blue);box-shadow:0 4px 20px rgba(0,122,255,.4)}
.speak-btn.recording{background:var(--red);box-shadow:0 4px 20px rgba(255,59,48,.5);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.speak-label{text-align:center;font-size:13px;color:var(--text2);margin-bottom:16px}
/* Listening */
.listen-player{background:linear-gradient(135deg,#5AC8FA,#007AFF);border-radius:16px;margin:0 16px 16px;padding:20px;color:#fff}
.listen-title{font-size:16px;font-weight:700;margin-bottom:16px}
.play-btn{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.25);border:none;font-size:28px;color:#fff;cursor:pointer;margin:0 auto 12px;display:flex;align-items:center;justify-content:center}
.play-btn:active{opacity:.7}
.listen-progress{height:4px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden;margin:0 4px 8px}
.listen-fill{height:100%;background:#fff;border-radius:2px;width:0%;transition:width .3s}
.listen-time{display:flex;justify-content:space-between;font-size:11px;opacity:.7}
.transcript-box{background:var(--card);border-radius:16px;margin:0 16px 16px;padding:16px}
.transcript-title{font-size:15px;font-weight:700;margin-bottom:10px}
.transcript-text{font-size:14px;line-height:1.7;color:var(--text2)}
/* Progress */
.band-card{background:linear-gradient(135deg,#007AFF,#5856D6);border-radius:20px;margin:0 16px 16px;padding:20px;color:#fff;display:flex;align-items:center;gap:16px}
.band-num{font-size:56px;font-weight:700;line-height:1}
.band-info{flex:1}
.band-label{font-size:14px;opacity:.8;margin-bottom:4px}
.band-range{font-size:20px;font-weight:700}
.band-desc{font-size:12px;opacity:.7;margin-top:4px}
.skill-progress-card{background:var(--card);border-radius:16px;margin:0 16px 10px;padding:14px 16px}
.spc-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.spc-name{font-size:15px;font-weight:600}
.spc-band{font-size:15px;font-weight:700;color:var(--blue)}
.pbar{height:6px;background:var(--gray5);border-radius:3px;overflow:hidden}
.pbar-fill{height:100%;border-radius:3px;transition:width .8s cubic-bezier(.34,1.56,.64,1)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px 16px}
.stat-card{background:var(--card);border-radius:14px;padding:14px}
.stat-val{font-size:26px;font-weight:700;margin-bottom:2px}
.stat-lbl{font-size:12px;color:var(--text2)}
/* Calendar strip */
.cal-strip{display:flex;gap:6px;padding:0 16px 16px;overflow-x:auto;scrollbar-width:none}
.cal-strip::-webkit-scrollbar{display:none}
.cal-day{min-width:40px;height:60px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex-shrink:0}
.cal-day.empty-day{background:var(--gray5)}
.cal-day.done-day{background:var(--green)}
.cal-day.partial-day{background:var(--orange)}
.cal-day.today-day{background:var(--blue)}
.cal-day.future-day{background:var(--card);border:1.5px solid var(--sep)}
.cal-day-num{font-size:14px;font-weight:700;color:#fff}
.cal-day.future-day .cal-day-num{color:var(--text2)}
.cal-day-lbl{font-size:9px;font-weight:600;color:rgba(255,255,255,.75);text-transform:uppercase}
.cal-day.future-day .cal-day-lbl{color:var(--gray3)}
/* Settings */
.trow{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:.5px solid var(--sep)}
.trow:last-child{border-bottom:none}
.trow-info{flex:1;margin-right:12px}
.trow-name{font-size:16px}
.trow-desc{font-size:13px;color:var(--text2);margin-top:1px}
.toggle{width:51px;height:31px;background:var(--gray4);border-radius:16px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--green)}
.toggle-thumb{position:absolute;top:2px;left:2px;width:27px;height:27px;background:#fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:left .2s cubic-bezier(.34,1.56,.64,1)}
.toggle.on .toggle-thumb{left:22px}
/* Overlay / Sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.overlay.on{opacity:1;pointer-events:all}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(105%);width:100%;max-width:430px;background:var(--gray6);border-radius:20px 20px 0 0;z-index:201;transition:transform .38s cubic-bezier(.32,.72,0,1);max-height:94vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.sheet.on{transform:translateX(-50%) translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--gray4);border-radius:2px;margin:12px auto 0}
.sheet-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 8px}
.sheet-t{font-size:17px;font-weight:600}
.sbtn{font-size:17px;font-weight:600;color:var(--blue);background:none;border:none;cursor:pointer;padding:4px 0;min-width:56px}
.sbtn.cancel{font-weight:400;color:var(--text2)}
/* Action btn */
.action-btn{display:block;width:calc(100% - 32px);margin:0 16px 12px;padding:15px;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center;transition:opacity .15s}
.action-btn:active{opacity:.75}
.action-btn.primary{background:var(--blue);color:#fff}
.action-btn.success{background:var(--green);color:#fff}
.action-btn.secondary{background:var(--gray5);color:var(--text)}
/* Badge */
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.badge-blue{background:#007AFF20;color:var(--blue)}
.badge-green{background:#34C75920;color:var(--green)}
.badge-orange{background:#FF9F0A20;color:var(--orange)}
.badge-purple{background:#AF52DE20;color:var(--purple)}
/* Toast */
.toast{position:fixed;top:calc(env(safe-area-inset-top)+20px);left:50%;transform:translateX(-50%) translateY(-80px);background:rgba(50,50,50,.92);color:#fff;padding:10px 20px;border-radius:24px;font-size:14px;font-weight:600;z-index:999;transition:transform .35s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;backdrop-filter:blur(10px)}
.toast.show{transform:translateX(-50%) translateY(0)}
/* Notif banner */
.notif-banner{margin:0 16px 14px;background:var(--card);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.notif-ico{font-size:28px;flex-shrink:0}
.notif-body{flex:1}
.notif-t{font-size:14px;font-weight:600;margin-bottom:2px}
.notif-s{font-size:12px;color:var(--text2)}
.notif-close{font-size:18px;color:var(--gray3);background:none;border:none;cursor:pointer;padding:4px}
/* Animations */
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fadein{animation:fadein .3s ease both}
/* Dark mode */
@media(prefers-color-scheme:dark){
  :root{--gray6:#000;--gray5:#2C2C2E;--gray4:#3A3A3C;--gray3:#48484A;--gray2:#636366;--card:#1C1C1E;--text:#FFF;--text2:rgba(235,235,245,.6);--sep:rgba(84,84,88,.65)}
  #tab-bar{background:rgba(28,28,30,.94)}
  .stab:not(.active){background:#2C2C2E}
  input,textarea{color-scheme:dark}
}
</style>
</head>
<body>
<div id="app">
  <div id="screen-today"   class="screen active"><div id="today-c"></div></div>
  <div id="screen-skills"  class="screen"><div id="skills-c"></div></div>
  <div id="screen-vocab"   class="screen"><div id="vocab-c"></div></div>
  <div id="screen-progress"class="screen"><div id="progress-c"></div></div>
  <div id="screen-settings"class="screen"><div id="settings-c"></div></div>
  <nav id="tab-bar">
    <div class="tab-item active" id="tab-today"    onclick="goTab('today')">    <span class="tab-icon">📅</span><span class="tab-label">Today</span></div>
    <div class="tab-item"        id="tab-skills"   onclick="goTab('skills')">   <span class="tab-icon">📖</span><span class="tab-label">Skills</span></div>
    <div class="tab-item"        id="tab-vocab"    onclick="goTab('vocab')">    <span class="tab-icon">📝</span><span class="tab-label">Vocab</span></div>
    <div class="tab-item"        id="tab-progress" onclick="goTab('progress')"> <span class="tab-icon">📊</span><span class="tab-label">Progress</span></div>
    <div class="tab-item"        id="tab-settings" onclick="goTab('settings')"> <span class="tab-icon">⚙️</span><span class="tab-label">Settings</span></div>
  </nav>
  <div class="overlay" id="ov"></div>
  <div class="sheet" id="sh"><div class="sheet-handle"></div><div class="sheet-hdr"><button class="sbtn cancel" onclick="closeSh()">Close</button><span class="sheet-t" id="sh-t"></span><span style="min-width:56px"></span></div><div id="sh-c"></div></div>
  <div id="toast" class="toast"></div>
</div>
<script>
// ═══════════════════════════════════════════════════════
// CONTENT DATABASE
// ═══════════════════════════════════════════════════════
const VOCAB_BANK = [
// ENVIRONMENT (Day 1-3)
{w:'mitigate',pos:'verb',def:'To make less severe or serious',ex:'Planting trees can mitigate the effects of urban heat islands.',syns:'alleviate, reduce, lessen'},

  text:`<p>Procrastination — the habitual delay of tasks despite knowing the costs of that delay — is one of the most studied yet poorly understood phenomena in psychology. Affecting an estimated twenty percent of adults chronically and up to ninety-five percent of students to some degree, it represents not a flaw of character but a complex failure of emotional regulation.</p>
<p>Traditional explanations framed procrastination as a time-management problem: inefficient people who failed to prioritise effectively. Contemporary research tells a starkly different story. Procrastination is now understood primarily as a strategy for managing negative emotions — anxiety, self-doubt, boredom, and fear of failure — associated with a task. Avoidance provides immediate emotional relief, even at the cost of future consequences.</p>

<p>Effective interventions focus on emotion regulation rather than time management. Techniques such as self-compassion (reducing harsh self-criticism after setbacks), implementation intentions ("if-then" planning), and task decomposition into smaller, less threatening steps have all shown promise. The goal is not to force oneself through discomfort with willpower alone, but to make tasks feel psychologically safer to begin.</p>`,

const KEY = 'ielts-tutor-v2';
let S = (() => {
  try { const r = localStorage.getItem(KEY); if(r) return JSON.parse(r); } catch(e){}
  return {
    startDate: new Date().toISOString().split('T')[0],
    completedDays: [],
    tasksDone: {},       // date -> [task keys]
    vocabLearned: [],    // indices into VOCAB_BANK
    vocabReview: {},     // index -> {correct,total,nextReview}
    scores: { reading:[], writing:[], speaking:[], listening:[] },
    settings: { notif: true, notifTime:'09:00', darkMode:'auto', dailyGoal: 4 },
    streak: 0,
    lastActive: ''
  };
})();
function save() { localStorage.setItem(KEY, JSON.stringify(S)); }

// ─── DATE UTILS ───────────────────────────────────────
function todayS() { return new Date().toISOString().split('T')[0]; }
function dayNum() {
  const start = new Date(S.startDate), today = new Date(todayS());
  return Math.floor((today - start) / 86400000) + 1;
}
function dateLabel(d) {
  const dt = new Date(d+'T12:00:00');
  return dt.toLocaleDateString('en-GB', {day:'numeric',month:'short'});
}
function updateStreak() {
  const t = todayS();
  if(S.lastActive === t) return;
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
  const yStr = yesterday.toISOString().split('T')[0];
  if(S.lastActive === yStr) S.streak++;
  else if(S.lastActive !== t) S.streak = 1;
  S.lastActive = t;
  save();
}

// ─── VOCAB FOR TODAY ──────────────────────────────────
function getTodayVocab() {
  const day = dayNum();
  const start = ((day - 1) * 10) % VOCAB_BANK.length;
  const words = [];
  for(let i = 0; i < 10; i++) words.push({idx: (start+i) % VOCAB_BANK.length, ...VOCAB_BANK[(start+i) % VOCAB_BANK.length]});
  return words;
}

// ─── TODAY'S TASKS ────────────────────────────────────
function getTodayTasks() {
  const day = dayNum();
  return [
    {key:'vocab',  icon:'📝', color:'#AF52DE20', iconColor:'#AF52DE', name:'Vocabulary',  desc:'Learn 10 new words for today', screen:'vocab'},
    {key:'read',   icon:'📖', color:'#007AFF20', iconColor:'#007AFF', name:'Reading',     desc:'Passage + comprehension questions', skill:'reading'},
    {key:'write',  icon:'✍️', color:'#FF2D5520', iconColor:'#FF2D55', name:'Writing',     desc: day%2===0 ? 'Academic Task 1' : 'Essay Task 2', skill:'writing'},
    {key:'listen', icon:'🎧', color:'#5AC8FA20', iconColor:'#5AC8FA', name:'Listening',   desc:'Audio transcript + questions', skill:'listening'},
    {key:'speak',  icon:'🗣️', color:'#FF9F0A20', iconColor:'#FF9F0A', name:'Speaking',    desc:'Cue card + discussion practice', skill:'speaking'},
  ];
}

function isTaskDone(key) {
  const t = todayS();
  return (S.tasksDone[t] || []).includes(key);
}
function markTaskDone(key) {
  const t = todayS();
  if(!S.tasksDone[t]) S.tasksDone[t] = [];
  if(!S.tasksDone[t].includes(key)) {
    S.tasksDone[t].push(key);
    if(!S.completedDays.includes(t)) {
      const done = S.tasksDone[t].length;
      if(done >= S.settings.dailyGoal) S.completedDays.push(t);
    }
    save();
    showToast('Task marked as complete ✓');
  }
  updateStreak();
}

// ─── TOAST ────────────────────────────────────────────
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

// ─── NAV ─────────────────────────────────────────────
let tab = 'today';
let skillTab = 'reading';

function goTab(t) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-'+t).classList.add('active');
  document.getElementById('tab-'+t).classList.add('active');
  tab = t;
  render();
}

function goSkill(sk) {
  skillTab = sk;
  document.getElementById('skills-c').innerHTML = '';
  renderSkills();
}

function render() {
  if(tab==='today')    renderToday();
  else if(tab==='skills')   renderSkills();
  else if(tab==='vocab')    renderVocab();
  else if(tab==='progress') renderProgress();
  else                      renderSettings();
}

function openSh(title, html) {
  document.getElementById('sh-t').textContent = title;
  document.getElementById('sh-c').innerHTML = html;
  document.getElementById('ov').classList.add('on');
  document.getElementById('sh').classList.add('on');

  document.getElementById('ov').classList.remove('on');
  document.getElementById('sh').classList.remove('on');
}

function renderToday() {
  updateStreak();
  const day = dayNum();
  const t = todayS();
  const tasks = getTodayTasks();
  const doneCt = tasks.filter(tk => isTaskDone(tk.key)).length;
  const vocabToday = getTodayVocab();

  // Calendar strip: last 7 days
  const calDays = [];
  for(let i=6; i>=0; i--) {
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = d.toISOString().split('T')[0];
    const dayDone = (S.tasksDone[ds]||[]).length;
    let cls = ds===t ? 'today-day' : i===0 ? 'today-day' : ds<t ? (dayDone>=4?'done-day':dayDone>0?'partial-day':'empty-day') : 'future-day';
    const label = ['S','M','T','W','T','F','S'][d.getDay()];
    calDays.push(`<div class="cal-day ${cls}"><div class="cal-day-num">${d.getDate()}</div><div class="cal-day-lbl">${label}</div></div>`);
  }

  const taskHtml = tasks.map(tk => {
    const done = isTaskDone(tk.key);
    const onclick = tk.screen ? `goTab('${tk.screen}')` : `goTab('skills');goSkill('${tk.skill}')`;
    return `<div class="task-card fadein" onclick="${onclick}">
      <div class="task-icon" style="background:${tk.color}">${tk.icon}</div>
      <div class="task-body">
        <div class="task-name">${tk.name}</div>
        <div class="task-desc">${tk.desc}</div>
      </div>
      <div class="task-check ${done?'done':''}">${done?'✓':''}</div>
    </div>`;
  }).join('');

  const vocabPreview = vocabToday.slice(0,4).map(v => {
    const learned = S.vocabLearned.includes(v.idx);
    return `<div class="vcard ${learned?'learned':''}" onclick="goTab('vocab')">
      <div class="vcard-word">${v.w}</div>
      <div class="vcard-pos">${v.pos}</div>
      <div class="vcard-def">${v.def}</div>
    </div>`;
  }).join('');

  document.getElementById('today-c').innerHTML = `
    <div class="screen-header">
      <div class="screen-title">Today</div>
      <div class="screen-subtitle">${dateLabel(t)} · Day ${day} of 60</div>
    </div>
    <div class="hero hero-bg-study">
      <div class="hero-badge">IELTS 2-Month Plan</div>
      <div class="hero-title">${doneCt===0?'Ready to study?':doneCt===tasks.length?'Day complete! 🎉':`Keep going!`}</div>
      <div class="hero-sub">${doneCt} of ${tasks.length} tasks done today</div>
      <div class="hero-day"><div class="hero-day-num">${day}</div><div class="hero-day-lbl">Day</div></div>
    </div>
    <div class="streak-row">
      <div class="streak-chip"><div class="streak-chip-ico">🔥</div><div><div class="streak-chip-val">${S.streak}</div><div class="streak-chip-lbl">Day streak</div></div></div>
      <div class="streak-chip"><div class="streak-chip-ico">📚</div><div><div class="streak-chip-val">${S.vocabLearned.length}</div><div class="streak-chip-lbl">Words learned</div></div></div>
    </div>
    <div class="cal-strip">${calDays.join('')}</div>
    <div class="section"><div class="sec-title">Today's Tasks</div>${taskHtml}</div>
    <div class="section">
      <div class="sec-title">Today's Vocabulary Preview</div>
      <div class="vocab-scroll">${vocabPreview}</div>
      <button class="action-btn primary" style="margin-top:10px" onclick="goTab('vocab')">Study All 10 Words →</button>
    </div>`;
}

function renderSkills() {
  const tabs = ['reading','writing','speaking','listening'];
  const icons = {reading:'📖',writing:'✍️',speaking:'🗣️',listening:'🎧'};
  const tabHtml = tabs.map(t => `<button class="stab ${skillTab===t?'active':''}" onclick="goSkill('${t}')">${icons[t]} ${t.charAt(0).toUpperCase()+t.slice(1)}</button>`).join('');

  let content = '';
  if(skillTab==='reading') content = renderReadingContent();
  else if(skillTab==='writing') content = renderWritingContent();
  else if(skillTab==='speaking') content = renderSpeakingContent();
  else content = renderListeningContent();

  document.getElementById('skills-c').innerHTML = `
    <div class="screen-header"><div class="screen-title">Skills</div><div class="screen-subtitle">IELTS Practice</div></div>
    <div class="skill-tabs">${tabHtml}</div>
    ${content}`;

  if(skillTab==='speaking') initSpeaking();
  if(skillTab==='listening') initListening();
}

// ── READING ──────────────────────────────────────────
let readState = {passIdx: dayNum() % READING_PASSAGES.length, answers: {}, submitted: false};

function renderReadingContent() {
  const p = READING_PASSAGES[readState.passIdx % READING_PASSAGES.length];
  const qHtml = p.questions.map((q,i) => {
    const optsHtml = q.opts.map((o,j) => {
      let cls = 'q-opt';
      if(readState.submitted) {
        if(j===q.ans) cls+=' correct';
        else if(readState.answers[i]===j) cls+=' wrong';
      } else if(readState.answers[i]===j) cls+=' selected';
      return `<button class="${cls}" onclick="selectAnswer(${i},${j})">${o}</button>`;
    }).join('');
    return `<div class="q-box"><div class="q-num">Question ${i+1}</div><div class="q-text">${q.q}</div><div class="q-opts">${optsHtml}</div></div>`;
  }).join('');

  const score = readState.submitted ? p.questions.filter((_,i) => readState.answers[i]===p.questions[i].ans).length : null;
  const actionBtn = readState.submitted
    ? `<button class="action-btn success" onclick="nextPassage()">Next Passage →</button>`
    : `<button class="action-btn primary" onclick="submitReading()">Check Answers</button>`;

  return `
    <div class="passage-box"><div class="passage-title">${p.title}</div><div class="passage-text">${p.text}</div></div>
    <div class="section"><div class="sec-title">Comprehension Questions ${readState.submitted?`· ${score}/${p.questions.length} correct`:''}</div></div>
    ${qHtml}
    ${actionBtn}`;
}

window.selectAnswer = function(q,a) {
  if(readState.submitted) return;
  readState.answers[q] = a;
  renderSkills();
};
window.submitReading = function() {
  if(Object.keys(readState.answers).length < READING_PASSAGES[readState.passIdx % READING_PASSAGES.length].questions.length) {
    showToast('Please answer all questions first'); return;
  }
  readState.submitted = true;
  const p = READING_PASSAGES[readState.passIdx % READING_PASSAGES.length];
  const score = p.questions.filter((_,i) => readState.answers[i]===p.questions[i].ans).length;
  const band = score>=5?7.5:score>=4?7:score>=3?6.5:score>=2?6:5.5;
  S.scores.reading.push({date:todayS(), score, band});
  markTaskDone('read');
  save();
  renderSkills();
};
window.nextPassage = function() {
  readState = {passIdx: (readState.passIdx+1) % READING_PASSAGES.length, answers:{}, submitted:false};
  renderSkills();
};

window.countWords = function(el) {
  const wc = el.value.trim().split(/\s+/).filter(Boolean).length;
  const els = document.querySelectorAll('#write-wc,#wc-top');
  els.forEach(e => { if(e.id==='wc-top') e.textContent=wc+' words'; else e.textContent=wc; });
};
window.toggleWriteTimer = function() {
  if(writeTimerInterval) { clearInterval(writeTimerInterval); writeTimerInterval=null; }
  else {
    writeTimerInterval = setInterval(() => {
      writeTimerSec++;
      const m = String(Math.floor(writeTimerSec/60)).padStart(2,'0');
      const s = String(writeTimerSec%60).padStart(2,'0');
      const el = document.getElementById('write-timer');
      if(el) el.textContent = m+':'+s;
    },1000);
  }
};
window.nextWriteTask = function() {
  writeIdx = (writeIdx+1) % WRITING_TASKS.length;
  clearInterval(writeTimerInterval); writeTimerInterval=null; writeTimerSec=0;
  renderSkills();
};
window.submitWriting = function() {
  const el = document.getElementById('essay-input');
  const wc = el ? el.value.trim().split(/\s+/).filter(Boolean).length : 0;
  if(wc < 50) { showToast('Write at least 50 words to complete'); return; }
  clearInterval(writeTimerInterval); writeTimerInterval=null; writeTimerSec=0;
  S.scores.writing.push({date:todayS(), words:wc});
  markTaskDone('write');
  save();
  showToast('Writing task complete! Well done 🎉');
};

let listenIdx = dayNum() % LISTENING_EXERCISES.length;
let listenAnswers = {}; let listenSubmitted = false;
let ttsUtterance = null; let isPlaying = false; let ttsProgress = 0;

function renderListeningContent() {
  const ex = LISTENING_EXERCISES[listenIdx];
  const qHtml = ex.questions.map((q,i) => {
    const optsHtml = q.opts.map((o,j) => {
      let cls = 'q-opt';
      if(listenSubmitted) {
        if(j===q.ans) cls+=' correct';
        else if(listenAnswers[i]===j) cls+=' wrong';
      } else if(listenAnswers[i]===j) cls+=' selected';
      return `<button class="${cls}" onclick="selectListenAns(${i},${j})">${o}</button>`;
    }).join('');
    return `<div class="q-box"><div class="q-num">Question ${i+1}</div><div class="q-text">${q.q}</div><div class="q-opts">${optsHtml}</div></div>`;
  }).join('');

  const score = listenSubmitted ? ex.questions.filter((_,i) => listenAnswers[i]===ex.questions[i].ans).length : null;
  const actionBtn = listenSubmitted
    ? `<button class="action-btn success" onclick="nextListenEx()">Next Exercise →</button>`
    : `<button class="action-btn primary" onclick="submitListening()">Check Answers</button>`;

  const scriptLines = ex.script.split('\n').map(l => l.trim()).filter(Boolean)
    .map(l => `<div style="margin-bottom:8px;font-size:14px;line-height:1.6;color:${l.includes(':')?'var(--text)':'var(--text2)'}">${l}</div>`).join('');

  return `
    <div class="listen-player">
      <div class="listen-title">${ex.title}</div>
      <button class="play-btn" id="play-btn" onclick="toggleTTS()">▶</button>
      <div class="listen-progress"><div class="listen-fill" id="listen-fill"></div></div>
      <div class="listen-time"><span id="listen-cur">0:00</span><span>Read aloud</span></div>
    </div>
    <div class="transcript-box">
      <div class="transcript-title">Transcript</div>
      <div class="transcript-text">${scriptLines}</div>
    </div>
    <div class="section"><div class="sec-title">Comprehension ${listenSubmitted?`· ${score}/${ex.questions.length} correct`:''}</div></div>
    ${qHtml}
    ${actionBtn}`;
}

function initListening() {}

window.toggleTTS = function() {
  if(!window.speechSynthesis) { showToast('Text-to-speech not supported'); return; }
  if(isPlaying) {
    speechSynthesis.cancel(); isPlaying = false;
    const btn = document.getElementById('play-btn');
    if(btn) btn.textContent='▶';
    return;
  }
  const ex = LISTENING_EXERCISES[listenIdx];
  ttsUtterance = new SpeechSynthesisUtterance(ex.script);
  ttsUtterance.rate = 0.85; ttsUtterance.pitch = 1;
  let voices = speechSynthesis.getVoices();
  const enVoice = voices.find(v => v.lang.startsWith('en'));
  if(enVoice) ttsUtterance.voice = enVoice;
  isPlaying = true;
  const btn = document.getElementById('play-btn');
  if(btn) btn.textContent='⏸';
  let sec = 0;
  const timer = setInterval(() => {
    sec++;
    const el = document.getElementById('listen-cur');
    if(el) el.textContent = `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
    const fill = document.getElementById('listen-fill');
    if(fill) fill.style.width = Math.min(100, sec/40*100)+'%';
  }, 1000);
  ttsUtterance.onend = () => {
    clearInterval(timer); isPlaying=false;
    const b = document.getElementById('play-btn'); if(b) b.textContent='▶';
    const f = document.getElementById('listen-fill'); if(f) f.style.width='100%';
  };
  speechSynthesis.speak(ttsUtterance);
};
window.selectListenAns = function(q,a) {
  if(listenSubmitted) return;
  listenAnswers[q]=a; renderSkills();
};
window.submitListening = function() {
  const ex = LISTENING_EXERCISES[listenIdx];
  if(Object.keys(listenAnswers).length < ex.questions.length) { showToast('Answer all questions first'); return; }
  listenSubmitted=true;
  const score = ex.questions.filter((_,i) => listenAnswers[i]===ex.questions[i].ans).length;
  S.scores.listening.push({date:todayS(), score, total:ex.questions.length});
  markTaskDone('listen'); save(); renderSkills();
};
window.nextListenEx = function() {
  if(isPlaying) { speechSynthesis.cancel(); isPlaying=false; }
  listenIdx=(listenIdx+1)%LISTENING_EXERCISES.length;
  listenAnswers={}; listenSubmitted=false;
  renderSkills();
};

function renderProgress() {
  const totalDays = S.completedDays.length;
  const totalWords = S.vocabLearned.length;
  const day = dayNum();

  // Estimate band scores
  const readScores = S.scores.reading;
  const avgRead = readScores.length ? readScores.reduce((s,r) => s+(r.band||6),0)/readScores.length : 0;
  const avgListen = S.scores.listening.length ? S.scores.listening.reduce((s,r) => s+(r.score/r.total*9),0)/S.scores.listening.length : 0;
  const writeCount = S.scores.writing.length;
  const speakCount = S.scores.speaking.length;

  const overallBand = readScores.length || S.scores.listening.length
    ? ((avgRead||5.5) + (avgListen||5.5) + 5.5 + 5.5) / 4
    : null;

  const skillBars = [
    {name:'Reading',  color:'#007AFF', val: readScores.length ? Math.round(avgRead*10)/10 : '—', pct: readScores.length ? Math.min(100,(avgRead-4)/5*100) : 0},
    {name:'Listening',color:'#5AC8FA', val: S.scores.listening.length ? Math.round(avgListen*10)/10 : '—', pct: S.scores.listening.length ? Math.min(100,(avgListen-4)/5*100) : 0},
    {name:'Writing',  color:'#AF52DE', val: writeCount>0 ? `${writeCount} session${writeCount>1?'s':''}` : '—', pct: Math.min(100, writeCount*20)},
    {name:'Speaking', color:'#FF9F0A', val: speakCount>0 ? `${speakCount} session${speakCount>1?'s':''}` : '—', pct: Math.min(100, speakCount*20)},
  ];

  const skillHtml = skillBars.map(s => `
    <div class="skill-progress-card">
      <div class="spc-hdr">
        <div class="spc-name">${s.name}</div>
        <div class="spc-band" style="color:${s.color}">${s.val}</div>
      </div>
      <div class="pbar"><div class="pbar-fill" style="width:${s.pct}%;background:${s.color}"></div></div>
    </div>`).join('');

  // Last 14 days calendar
  const calDays = [];
  for(let i=13; i>=0; i--) {
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = d.toISOString().split('T')[0];
    const done = (S.tasksDone[ds]||[]).length;
    const isT = ds===todayS();
    let cls = isT?'today-day':done>=4?'done-day':done>0?'partial-day':ds<todayS()?'empty-day':'future-day';
    calDays.push(`<div class="cal-day ${cls}" style="min-width:36px;height:52px"><div class="cal-day-num" style="font-size:12px">${d.getDate()}</div><div class="cal-day-lbl">${['S','M','T','W','T','F','S'][d.getDay()]}</div></div>`);
  }

  const rings = [
    {p:Math.min(100,Math.round(totalDays/60*100)), color:'#34C759',label:'Days'},
    {p:Math.min(100,Math.round(totalWords/200*100)),color:'#007AFF',label:'Words'},
    {p:Math.min(100,Math.round(S.streak/30*100)),  color:'#FF9F0A',label:'Streak'},
  ];
  const ringsHtml = rings.map(r => {
    const radius=30, circ=2*Math.PI*radius, off=circ*(1-r.p/100);
    return `<div class="ring-item">
      <div class="ring-wrap" style="width:66px;height:66px">
        <svg width="66" height="66" viewBox="0 0 66 66">
          <circle class="ring-track" cx="33" cy="33" r="${radius}" stroke-width="6"/>
          <circle class="ring-fill" cx="33" cy="33" r="${radius}" stroke="${r.color}" stroke-width="6"
            stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${circ.toFixed(1)}" data-off="${off.toFixed(1)}"/>
        </svg>
        <div class="ring-pct" style="color:${r.color};font-size:13px">${r.p}%</div>
      </div>
      <div class="ring-label">${r.label}</div>
    </div>`;
  }).join('');

  document.getElementById('progress-c').innerHTML = `
    <div class="screen-header"><div class="screen-title">Progress</div><div class="screen-subtitle">Day ${day} of 60</div></div>
    ${overallBand ? `<div class="band-card">
      <div><div class="band-num">${overallBand.toFixed(1)}</div></div>
      <div class="band-info"><div class="band-label">Estimated Band</div><div class="band-range">${overallBand>=7?'C1–C2 Level':'B2 Level'}</div><div class="band-desc">Based on practice scores</div></div>
    </div>` : `<div class="hero hero-bg-study" style="margin-bottom:16px"><div class="hero-badge">Target</div><div class="hero-title">IELTS Band 7.0+</div><div class="hero-sub">Complete tasks to track your progress</div></div>`}
    <div class="rings-row">${ringsHtml}</div>
    <div class="section">
      <div class="sec-title">14-Day Study Calendar</div>
      <div class="cal-strip" style="padding:0 16px 8px">${calDays.join('')}</div>
    </div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-val" style="color:var(--green)">${totalDays}</div><div class="stat-lbl">Days completed</div></div>
      <div class="stat-card"><div class="stat-val" style="color:var(--blue)">${totalWords}</div><div class="stat-lbl">Words learned</div></div>
      <div class="stat-card"><div class="stat-val" style="color:var(--orange)">🔥 ${S.streak}</div><div class="stat-lbl">Current streak</div></div>
      <div class="stat-card"><div class="stat-val" style="color:var(--purple)">${day}</div><div class="stat-lbl">Day of program</div></div>
    </div>
    <div class="section"><div class="sec-title">Skill Progress</div>${skillHtml}</div>`;

  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll('.ring-fill[data-off]').forEach(el => {
      el.style.strokeDashoffset = el.dataset.off;
    });
    document.querySelectorAll('.pbar-fill').forEach(el => {
      const w = el.style.width; el.style.width='0'; requestAnimationFrame(()=>el.style.width=w);
    });
  }));
}

// NOTIFICATIONS
// ═══════════════════════════════════════════════════════
function requestNotifPermission() {
  if('Notification' in window && Notification.permission==='default') {
    Notification.requestPermission().then(p => {
      if(p==='granted') {
        showToast('Notifications enabled!');
        scheduleNotification();
      }
    });
  }
}

function scheduleNotification() {
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  if(!S.settings.notif) return;
  const [h,m] = S.settings.notifTime.split(':').map(Number);
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
  if(next <= now) next.setDate(next.getDate()+1);
  const delay = next - now;
  setTimeout(() => {
    new Notification('IELTS Daily Study 📚', {
      body: `Day ${dayNum()}: Your English lesson is ready! Keep your streak going 🔥`,
      icon: '/icon-192.png'
    });
  }, delay);
}

// ═══════════════════════════════════════════════════════
// SWIPE TO DISMISS SHEET
// ═══════════════════════════════════════════════════════
function makeSwipeable(el, closeFn) {
  const handle = el.querySelector('.sheet-handle');
  if(!handle) return;
  let startY=0, active=false;
  handle.addEventListener('touchstart', e => { startY=e.touches[0].clientY; active=true; el.style.transition='none'; }, {passive:true});
  handle.addEventListener('touchmove', e => { if(!active) return; const dy=Math.max(0,e.touches[0].clientY-startY); el.style.transform=`translateX(-50%) translateY(${dy}px)`; }, {passive:true});
  handle.addEventListener('touchend', e => {
    if(!active) return; active=false; el.style.transition='';
    if(Math.max(0,e.changedTouches[0].clientY-startY)>100) closeFn();
    else el.style.transform='';
  }, {passive:true});
}

// ═══════════════════════════════════════════════════════
// PWA ICONS (generated via canvas — no external files needed)
// ═══════════════════════════════════════════════════════
function injectIcons() {
  [192, 512].forEach(size => {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const r = size * 0.22;
    ctx.beginPath();
    ctx.moveTo(r, 0); ctx.lineTo(size-r, 0);
    ctx.arcTo(size, 0, size, r, r);
    ctx.lineTo(size, size-r);
    ctx.arcTo(size, size, size-r, size, r);
    ctx.lineTo(r, size);
    ctx.arcTo(0, size, 0, size-r, r);
    ctx.lineTo(0, r);
    ctx.arcTo(0, 0, r, 0, r);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, 0, size, size);
    g.addColorStop(0, '#007AFF'); g.addColorStop(1, '#5856D6');
    ctx.fillStyle = g; ctx.fill();
    ctx.font = `bold ${size*0.42}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('📚', size/2, size/2 + size*0.04);
    const url = c.toDataURL('image/png');
    const link = document.createElement('link');
    link.rel = size===192 ? 'apple-touch-icon' : 'icon';
    link.sizes = `${size}x${size}`; link.href = url;
    document.head.appendChild(link);
    // Patch manifest icon src so browsers can resolve it
    if(size===192||size===512) {
      fetch('manifest.json').then(r=>r.json()).then(m=>{
        m.icons.forEach(ic=>{ if(ic.sizes===`${size}x${size}`) ic.src=url; });
      }).catch(()=>{});
    }
  });
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
updateStreak();
render();
makeSwipeable(document.getElementById('sh'), closeSh);
injectIcons();
if(S.settings.notif && 'Notification' in window && Notification.permission==='granted') scheduleNotification();
else if(S.settings.notif && 'Notification' in window && Notification.permission==='default') {
  setTimeout(requestNotifPermission, 3000);
}
</script>
